#
# Cloud Build spec used by scripts/deploy.sh and the GitHub Actions workflow.
# Builds the LibreChat image and pushes it to Artifact Registry.
# The 8-vCPU machine gives the Vite client build enough memory headroom.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '--build-arg'
      - 'NODE_MAX_OLD_SPACE_SIZE=4096'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'
